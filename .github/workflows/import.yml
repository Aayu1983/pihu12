name: Azure Terraform Import

on:
  workflow_dispatch:
    inputs:
      terraform_directory:
        description: "Folder path (e.g., routetable)"
        required: true
        default: "routetable" # Aapka folder name yahan hona chahiye

permissions:
  id-token: write
  contents: read

jobs:
  terraform-job:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
    
    defaults:
      run:
        working-directory: ${{ github.event.inputs.terraform_directory }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0 # Version 1.5+ zaroori hai import block ke liye
          terraform_wrapper: false 

      - name: Terraform Init
        run: terraform init

      # IMPORT COMMAND KI ZAROORAT NAHI HAI agar code mein import {} block hai.
      # Plan hi import ka kaam shuru kar dega.
      
      - name: Terraform Plan
        run: terraform plan

      # State file update karne ke liye Apply zaroori hai
     # - name: Terraform Apply
     #   run: terraform apply -auto-approve
